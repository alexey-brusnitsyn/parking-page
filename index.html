<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ГО «АБСУ» — сайт у розробці</title>
<meta name="description" content="Громадська організація «Асоціація будівництва з соломи в Україні» (Ukrainian Straw Building Association). Сайт у розробці.">
<meta property="og:title" content="ГО «АБСУ» — Асоціація будівництва з соломи в Україні">
<meta property="og:description" content="Громадська організація. Сайт у розробці.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#f5ead8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23c67139'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@600&family=Manrope:wght@400;700&display=swap">
<style>
:root{--bg:#f5ead8;--text:#201e1d;--accent:#c67139;--n400:#c0b6a5;--n700:#645c50;--n800:#474238;--a200:#ffe1d0;--a300:#ffc6a5;--a400:#f6a06b;--a500:#d67f48;--s400:#aebf92;--shadow:0 3px 10px rgba(46,43,37,.16);--fh:"Rubik",system-ui,sans-serif;--fb:"Manrope",system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:var(--fb)}
.page{position:relative;min-height:100vh;min-height:100dvh;overflow:hidden;display:flex;flex-direction:column}
.sun{position:absolute;right:8vw;bottom:24vh;width:min(34vw,340px);height:min(34vw,340px);border-radius:50%;background:var(--a200);animation:rise 2.4s cubic-bezier(.2,.8,.2,1) .1s both}
.content{position:relative;z-index:2;width:100%;max-width:1100px;margin:0 auto;padding:clamp(24px,7vh,80px) clamp(20px,5vw,28px) 0;display:flex;flex-direction:column;gap:clamp(16px,3vh,22px)}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:44px;height:44px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:var(--bg);font-family:var(--fh);font-weight:600;font-size:20px}
.brand-txt{display:flex;flex-direction:column;line-height:1.15}
.brand-name{font-family:var(--fh);font-weight:600;font-size:20px}
.brand-sub{font-size:12px;color:var(--n700)}
.badge{display:inline-flex;align-items:center;gap:14px;align-self:flex-start;padding:clamp(10px,1.6vw,14px) clamp(20px,3vw,28px);border-radius:999px;background:var(--accent);color:var(--bg);font-size:clamp(16px,2vw,22px);font-weight:700;box-shadow:var(--shadow)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--bg);animation:pulse 1.8s ease-in-out infinite}
h1{margin:0;font-family:var(--fh);font-weight:600;font-size:clamp(30px,6.2vw,64px);line-height:1.08;letter-spacing:-.015em;max-width:820px;text-wrap:balance}
p{margin:0;font-size:clamp(16px,1.6vw,19px);line-height:1.6;max-width:560px;color:var(--n800);text-wrap:pretty}
.f1{animation:fadeUp .9s cubic-bezier(.2,.8,.2,1) .2s both}
.f2{animation:fadeUp .9s cubic-bezier(.2,.8,.2,1) .35s both}
.f3{animation:fadeUp .9s cubic-bezier(.2,.8,.2,1) .5s both}
.field{position:relative;z-index:1;flex:1 1 0;min-height:clamp(140px,26vh,320px);margin-top:clamp(24px,5vh,40px);padding:24px 2vw 0;display:flex;align-items:flex-end;justify-content:space-between}
.stalk{width:.7vw;min-width:4px;transform-origin:bottom center;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both}
.stalk i{display:block;position:relative;height:100%;width:100%;transform-origin:bottom center;animation:sway 4s ease-in-out infinite}
.stalk i::before{content:"";position:absolute;inset:0;border-radius:999px;background:currentColor;opacity:.75}
.stalk i::after{content:"";position:absolute;left:50%;top:-18px;width:220%;height:34px;transform:translateX(-50%);border-radius:999px;background:currentColor}
@media (max-width:599px){.stalk{width:1.4vw}.sun{right:-12vw;bottom:14vh;width:52vw;height:52vw}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes rise{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeUp{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="page">
  <div class="sun" aria-hidden="true"></div>
  <main class="content">
    <div class="brand">
      <span class="mark">А</span>
      <span class="brand-txt"><span class="brand-name">ГО «АБСУ»</span><span class="brand-sub">Ukrainian Straw Building Association</span></span>
    </div>
    <span class="badge f1"><span class="dot"></span>Сайт у розробці</span>
    <h1 class="f2">Асоціація будівництва з соломи в Україні</h1>
    <p class="f3">Громадська організація, що обʼєднує власників, архітекторів, будівельників і фермерів довкола теплих і здорових будинків із соломи. Наш сайт скоро запрацює.</p>
  </main>
  <div class="field" id="field" aria-hidden="true"></div>
</div>
<script>
(function(){
  var w=window.innerWidth,n=w<600?30:w<1024?46:64,f=document.getElementById('field'),h='';
  var c=['var(--a400)','var(--a500)','var(--n400)','var(--s400)','var(--a300)'];
  for(var i=0;i<n;i++){
    var r=Math.sin(i*12.9898)*43758.5453;r=r-Math.floor(r);
    var ht=52+r*34+Math.sin(i/5)*8;
    h+='<div class="stalk" style="height:'+ht.toFixed(1)+'%;color:'+c[i%5]+';animation-delay:'+(0.2+i*0.012).toFixed(3)+'s"><i style="animation-duration:'+(3.2+r*2.4).toFixed(2)+'s;animation-delay:'+(-r*4).toFixed(2)+'s"></i></div>';
  }
  f.innerHTML=h;
})();
</script>
</body>
</html>
